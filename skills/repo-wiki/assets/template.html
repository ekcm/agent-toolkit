<style>
/* Layout: three panes. Wiki index left, live dependency map centre, reading/asking panel right. */
:root {
  --bg: #f3f4f1; --surface: #ffffff; --sunken: #e9ebe6; --ink: #18212b; --muted: #5b6672; --faint: #8d96a0;
  --line: #d6dad3; --accent: #1d6b86; --accent-soft: #d8eaf0; --warn: #b4540a; --bug: #b4232c; --ok: #2b7a3d;
  --edge: #a9b0b7; --code-bg: #f7f8f5; --hl: #fff1b8;
  --l-entry: #d9480f; --l-interface: #c2255c; --l-job: #8e3bb0; --l-ui: #c0619b; --l-service: #1f6fc0; --l-logic: #4f7fb0;
  --l-client: #0b8292; --l-data: #1f7a55; --l-table: #4a5560; --l-external: #c98400; --l-mapper: #6b9a12;
  --l-model: #8a939c; --l-config: #a7afb6; --l-util: #b3a48a;

  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12171d; --surface: #1a2028; --sunken: #0f1419; --ink: #e4e8ec; --muted: #9aa5b1; --faint: #6d7883;
  --line: #2a323c; --accent: #5fb7d4; --accent-soft: #1d3540; --warn: #f0a050; --bug: #f2727a; --ok: #6cc785;
  --edge: #4a545f; --code-bg: #151b22; --hl: #4a3f12;
  --l-entry: #ff7a3d; --l-interface: #f06595; --l-job: #c77dec; --l-ui: #e58cc0; --l-service: #5ea8f0; --l-logic: #86aed6;
  --l-client: #3cc4d4; --l-data: #4fc28e; --l-table: #a9b5c1; --l-external: #f5b83d; --l-mapper: #a3d14a;
  --l-model: #7d8893; --l-config: #626c76; --l-util: #8f8470;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12171d; --surface: #1a2028; --sunken: #0f1419; --ink: #e4e8ec; --muted: #9aa5b1; --faint: #6d7883;
  --line: #2a323c; --accent: #5fb7d4; --accent-soft: #1d3540; --warn: #f0a050; --bug: #f2727a; --ok: #6cc785;
  --edge: #4a545f; --code-bg: #151b22; --hl: #4a3f12;
  --l-entry: #ff7a3d; --l-interface: #f06595; --l-job: #c77dec; --l-ui: #e58cc0; --l-service: #5ea8f0; --l-logic: #86aed6;
  --l-client: #3cc4d4; --l-data: #4fc28e; --l-table: #a9b5c1; --l-external: #f5b83d; --l-mapper: #a3d14a;

[hidden] { display: none !important; }
html, body { height: 100%; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
header.top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 10px;

.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

.main { display: grid; grid-template-columns: 210px minmax(0, 1fr) 420px; min-height: 0; }

.canvas { position: relative; min-height: 0; background: radial-gradient(circle, var(--line) 1px, transparent 1.2px) 0 0 / 22px 22px, var(--bg); }

#seq { position: absolute; inset: 0; overflow: auto; background: var(--bg); }
#seq svg { display: block; }
#seq .lifeline { stroke: var(--line); stroke-dasharray: 4 4; }

#seq .msg line { stroke: var(--accent); stroke-width: 1.6; }

#seq .gap text { fill: var(--muted); font: italic 11.5px var(--f-body); }

.legend .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
.chip img { width: 14px; height: 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 6px; padding: 8px 14px; border-top: 1px solid var(--line); background: var(--bg); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 7px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 12px; color: var(--ink); }
.chip.off { opacity: 0.45; background: transparent; }
.chip.off .dot { background: transparent !important; outline: 1.5px solid var(--faint); }
.hint { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--muted); background: color-mix(in srgb, var(--surface) 86%, transparent); padding: 4px 8px; border-radius: var(--r); pointer-events: none; max-width: calc(100% - 24px); }

aside.panel { border-left: 1px solid var(--line); background: var(--surface); display: grid; grid-template-rows: auto 1fr; min-height: 0; min-width: 0; }
.tabs { display: flex; gap: 2px; padding: 8px 12px 0; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 7px 12px 9px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.pane { overflow: auto; min-height: 0; padding: 18px 20px 40px; }
.pane[hidden] { display: none; }
.pane h3 { font-family: var(--f-display); font-weight: 700; font-size: 22px; line-height: 1.2; margin: 0 0 6px; text-wrap: balance; letter-spacing: -0.01em; word-break: break-word; }
.pane h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); margin: 22px 0 8px; font-weight: 600; }
.pane p { margin: 0 0 10px; max-width: 65ch; }
.lede { color: var(--muted); }
.prose code { background: var(--sunken); padding: 1px 4px; border-radius: 3px; }
.nodelink { border: 0; background: none; padding: 0; color: var(--accent); font-family: var(--f-mono); font-size: 0.86em; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent); text-underline-offset: 2px; text-align: left; word-break: break-word; }
.ref { border: 0; background: none; padding: 0; color: var(--muted); font-family: var(--f-mono); font-size: 11.5px; text-align: left; word-break: break-all; }
.ref:hover { color: var(--accent); text-decoration: underline; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 12px; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: var(--sunken); color: var(--muted); }
.scores { display: grid; grid-template-columns: auto 1fr auto; gap: 5px 10px; align-items: center; font-size: 12.5px; }
.bar { height: 6px; background: var(--sunken); border-radius: 3px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); }
.scores .v { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.list li { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; min-width: 0; flex-wrap: wrap; }
.list .k { font-size: 11px; color: var(--faint); font-family: var(--f-mono); white-space: nowrap; }
.steps { list-style: none; padding: 0; margin: 0; counter-reset: s; }
.steps li { position: relative; padding: 0 0 14px 34px; border-left: 1.5px solid var(--line); margin-left: 11px; }
.steps li:last-child { border-left-color: transparent; }
.steps li::before { counter-increment: s; content: counter(s); position: absolute; left: -12px; top: -2px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--accent); color: var(--accent); font: 600 11px/19px var(--f-mono); text-align: center; }
.steps li.cur::before { background: var(--accent); color: var(--surface); }
.steps .t { display: block; margin-bottom: 2px; }
.steps .d { display: block; color: var(--muted); font-size: 13px; margin-bottom: 2px; }
.steps .async { display: inline-block; font-size: 11px; color: var(--warn); font-style: italic; margin-bottom: 2px; }
.card { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; margin-bottom: 10px; }
.card .head { display: flex; gap: 8px; align-items: baseline; margin-bottom: 6px; flex-wrap: wrap; }
.card b { font-weight: 600; }
.card dl { margin: 6px 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 13px; }
.card dt { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; padding-top: 2px; }
.card dd { margin: 0; min-width: 0; }
.card ol { margin: 6px 0 0; padding-left: 20px; }
.card ol li { margin-bottom: 6px; }
.sev { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 600; padding: 1px 6px; border-radius: 3px; white-space: nowrap; }
.sev.bug { color: var(--bug); background: color-mix(in srgb, var(--bug) 12%, transparent); }
.sev.risk { color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); }
.sev.design { color: var(--accent); background: var(--accent-soft); }
.sev.cleanup { color: var(--muted); background: var(--sunken); }
dl.gloss { margin: 0; display: grid; gap: 12px; }
dl.gloss dt { font-weight: 600; }
dl.gloss dd { margin: 2px 0 0; color: var(--muted); max-width: 65ch; }
.modcard { padding: 12px 0; border-bottom: 1px solid var(--line); }
.modcard:last-child { border-bottom: 0; }
.back { border: 0; background: none; padding: 0; color: var(--muted); font-size: 12.5px; margin-bottom: 10px; }
.back:hover { color: var(--ink); }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 6px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 5px 10px; border-radius: var(--r); font-size: 12.5px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn:disabled { opacity: 0.5; cursor: default; }
a.btn { color: var(--ink); text-decoration: none; display: inline-block; }
.src { margin: 0 -20px; background: var(--code-bg); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); overflow-x: auto; font-family: var(--f-mono); font-size: 12px; line-height: 1.6; }
.src table { border-collapse: collapse; width: max-content; min-width: 100%; }
.src td { padding: 0 12px 0 0; white-space: pre; vertical-align: top; }
.src td.ln { color: var(--faint); text-align: right; padding: 0 10px 0 14px; user-select: none; position: sticky; left: 0; background: var(--code-bg); }
.src tr.hl td { background: var(--hl); }
.src .a { color: var(--l-job); } .src .s { color: var(--l-data); } .src .kw { color: var(--l-interface); } .src .c { color: var(--faint); font-style: italic; }
.ask { display: grid; grid-template-rows: 1fr auto; min-height: 0; padding: 0; }
.ask[hidden] { display: none; }
.thread { overflow: auto; padding: 18px 20px; display: grid; gap: 14px; align-content: start; }
.msg-u { justify-self: end; background: var(--accent-soft); padding: 8px 12px; border-radius: 12px 12px 2px 12px; max-width: 88%; }
.msg-a { line-height: 1.55; min-width: 0; }
.msg-a pre { background: var(--code-bg); padding: 10px 12px; border-radius: var(--r); overflow-x: auto; font-size: 12px; border: 1px solid var(--line); }
.msg-a ul, .msg-a ol { padding-left: 20px; margin: 6px 0; }
.msg-a p { margin: 0 0 8px; }
.status { color: var(--muted); font-size: 12.5px; display: flex; gap: 8px; align-items: center; }
.dots::after { content: "…"; animation: blink 1.2s steps(4) infinite; }
@keyframes blink { 0% { opacity: .2 } 50% { opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .dots::after { animation: none; } }
.starters { display: grid; gap: 6px; }
.starters button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 8px 10px; color: var(--ink); }
.starters button:hover { border-color: var(--accent); }
.composer { border-top: 1px solid var(--line); padding: 10px 12px 12px; display: grid; gap: 6px; }
.composer .ctxline { font-size: 11.5px; color: var(--muted); min-height: 1em; }
.composer form { display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { flex: 1; resize: none; min-height: 40px; max-height: 140px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); }
.note { font-size: 12.5px; color: var(--muted); padding: 10px 12px; border: 1px dashed var(--line); border-radius: var(--r); }

@media (max-width: 1180px) { .main { grid-template-columns: 190px minmax(0, 1fr) 360px; } }
@media (max-width: 960px) {
  .app { height: auto; min-height: 100%; }
  .main { grid-template-columns: minmax(0, 1fr); }
  nav.index { border-right: 0; border-bottom: 1px solid var(--line); display: flex; gap: 4px; overflow-x: auto; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
  .index h2, .index .count { display: none; }
  .index button { white-space: nowrap; width: auto; }
  .stage { height: 64vh; min-height: 420px; }
  aside.panel { border-left: 0; border-top: 1px solid var(--line); }
  .pane { overflow: visible; }
  .ask { min-height: 70vh; }
  .search { flex-basis: 100%; margin-left: 0; }
}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><h1 id="title"></h1><span class="stamp" id="stamp"></span></div>
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
      <input id="q" type="search" placeholder="Find code, a table, an endpoint or a term" autocomplete="off" aria-label="Search the wiki">
      <div class="results" id="results" hidden></div>
    </div>
  </header>
  <div class="main">
    <nav class="index" id="index" aria-label="Wiki pages"></nav>

      <div class="toolbar">
        <div class="ctl" id="levelCtl"><div class="seg" id="levelSeg"><button data-v="arch">Architecture</button><button data-v="code" class="on">Code</button></div></div>
        <div class="ctl" id="groupCtl">Group <div class="seg" id="groupSeg"><button data-v="feature">By feature</button><button data-v="none">Off</button></div></div>
        <label class="ctl" id="compCtl">Component <select id="comp"></select></label>
        <label class="ctl">Rank by
          <select id="rank">
            <option value="core">Overall importance</option>
            <option value="drives">Drives the most</option>
            <option value="onPath">On request paths</option>
            <option value="depended">Most depended on</option>
            <option value="churn">Most changed</option>
          </select>
        </label>
        <label class="ctl">Show top <input id="topn" type="range" min="5" max="200" step="1" value="30"><output id="topnOut">30</output></label>
        <div class="ctl"><div class="seg" id="layoutSeg"><button data-v="lanes" class="on">Layers</button><button data-v="organic">Organic</button></div></div>
        <div class="ctl" id="flowViewCtl" hidden><div class="seg" id="flowSeg"><button data-v="map" class="on">Map</button><button data-v="seq">Sequence</button></div></div>
        <span id="focusSlot"></span>
      </div>
      <div class="canvas">
        <div id="cy" role="img" aria-label="Interactive dependency graph"></div>

      <div class="ask" id="ask" hidden>
        <div class="thread" id="thread"></div>
        <div class="composer">
          <div class="ctxline" id="ctxline"></div>
          <form id="askForm"><textarea id="askInput" rows="2" placeholder="Ask about this codebase"></textarea><button class="btn primary" id="askBtn" type="submit">Ask</button></form>
        </div>
      </div>
    </aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<script>
const DATA = "__DATA__";
const G = DATA.graph, W = DATA.wiki, SRC = DATA.sources;
W.summaries = W.summaries || {}; W.flows = W.flows || []; W.keyParts = W.keyParts || []; W.recipes = W.recipes || [];
W.stateMachines = W.stateMachines || []; W.gotchas = W.gotchas || []; W.glossary = W.glossary || []; W.components = W.components || [];
const BLOB = G.repoUrl ? `${G.repoUrl}/blob/${G.commitFull}/` : null;
const byId = Object.fromEntries(G.nodes.map(n => [n.id, n]));

  const g = e.target.closest("[data-group],[data-opengroup]");
  if (g && !g.closest("#index")) { if (g.dataset.opengroup) return openGroupCode(g.dataset.opengroup); if (S.level === "arch" && S.view === "map") archHighlight("grp:" + g.dataset.group); return showGroup(g.dataset.group); }
  const t = e.target.closest("[data-node],[data-ref],[data-page],[data-back],[data-focus],[data-askabout],[data-comp]");
  if (!t || t.closest("#index") || t.closest(".results") || t.closest("#seq")) return;
  if (t.dataset.back !== undefined) { if (returnTo != null) { $("#read").innerHTML = returnTo; returnTo = null; } return; }
  if (t.dataset.step !== undefined && S.view === "flow") return clickStep(+t.dataset.step);
  if (t.dataset.comp) { S.comp = t.dataset.comp; S.level = "code"; syncSeg(); drawMap(); return openComponent(S.comp); }
  if (t.dataset.node) return selectNode(t.dataset.node);
  if (t.dataset.ref) return openSource(t.dataset.ref);
  if (t.dataset.page) return openPage(t.dataset.page);
  if (t.dataset.focus) { S.focus = t.dataset.focus; S.selected = S.focus; drawMap(); showNode(S.focus); return; }
  if (t.dataset.askabout) { showTab("ask"); $("#askInput").value = `Explain ${byId[t.dataset.askabout].label}: what it does, who calls it, and what could break if I change it.`; $("#askInput").focus(); }
});

// ---------- search ----------
const searchIndex = [
  ...G.nodes.map(n => ({ kind: "node", id: n.id, label: n.label, sub: n.path ? short(n.path) : layerName(n.layer), hay: (n.label + " " + (n.path || "") + " " + (W.summaries[n.id] || "") + " " + (n.symbols || []).map(s => s.name).join(" ")).toLowerCase(), color: layerColor(n.layer) })),
  ...W.glossary.map(g => ({ kind: "term", id: g.term, label: g.term, sub: "glossary", hay: (g.term + " " + g.def).toLowerCase() })),
  ...W.flows.map(f => ({ kind: "page", id: "flow:" + f.id, label: f.title, sub: "flow", hay: (f.title + " " + (f.summary || "")).toLowerCase() })),
  ...GROUPS.map(g => ({ kind: "group", id: g.id, label: groupLabel(g.id), sub: "group", hay: (groupLabel(g.id) + " " + ((wGroup[g.id] || {}).body || "")).toLowerCase(), color: layerColor(g.layer) })),
  ...W.recipes.map(r => ({ kind: "page", id: "recipes", label: r.title, sub: "recipe", hay: (r.title + " " + (r.goal || "")).toLowerCase() })),
];
let hits = [], hitIdx = 0;
function runSearch(q) {
  q = q.trim().toLowerCase(); if (!q) { $("#results").hidden = true; return; }
  hits = searchIndex.map(x => ({ x, s: x.label.toLowerCase().startsWith(q) ? 3 : x.label.toLowerCase().includes(q) ? 2 : x.hay.includes(q) ? 1 : 0 })).filter(h => h.s).sort((a, b) => b.s - a.s).slice(0, 14).map(h => h.x);
  hitIdx = 0;
  $("#results").innerHTML = hits.length ? hits.map((h, i) => `<button data-i="${i}" class="${i === 0 ? "on" : ""}">${h.color ? `<i class="dot" style="background:${h.color}"></i>` : ""}${esc(h.label)}<span class="sub">${esc(h.sub)}</span></button>`).join("") : `<div style="padding:8px 10px;color:var(--muted)">Nothing matches “${esc(q)}”.</div>`;
  $("#results").hidden = false;
}
function pick(h) {
  $("#results").hidden = true; $("#q").value = "";
  if (h.kind === "node") selectNode(h.id); else if (h.kind === "page") openPage(h.id);
  else if (h.kind === "group") { if (S.view !== "map") openPage("overview"); if (S.level === "arch") archHighlight("grp:" + h.id); showGroup(h.id); }
  else { openPage("glossary"); requestAnimationFrame(() => [...document.querySelectorAll("dt")].find(d => d.textContent === h.id)?.scrollIntoView({ block: "center" })); }
}
$("#q").addEventListener("input", e => runSearch(e.target.value));
$("#q").addEventListener("keydown", e => {
  if ($("#results").hidden) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); hitIdx = (hitIdx + (e.key === "ArrowDown" ? 1 : -1) + hits.length) % hits.length; $("#results").querySelectorAll("button").forEach((b, i) => b.classList.toggle("on", i === hitIdx)); }
  if (e.key === "Enter" && hits[hitIdx]) { e.preventDefault(); pick(hits[hitIdx]); }
  if (e.key === "Escape") $("#results").hidden = true;
});
$("#results").addEventListener("click", e => { const b = e.target.closest("[data-i]"); if (b) pick(hits[+b.dataset.i]); });
document.addEventListener("click", e => { if (!e.target.closest(".search")) $("#results").hidden = true; });

// ---------- tabs ----------
function showTab(t) { $("#tabRead").classList.toggle("on", t === "read"); $("#tabAsk").classList.toggle("on", t === "ask"); $("#read").hidden = t !== "read"; $("#ask").hidden = t !== "ask"; if (t === "ask") updateCtx(); }
$("#tabRead").onclick = () => showTab("read");
$("#tabAsk").onclick = () => showTab("ask");

// ---------- ask (needs a host that gives pages a `sample` capability through window.claude.use) ----------
const turns = []; let sample = null, sampleChecked = false, askCtl = null, busy = false, statusEl = null;
function updateCtx() { $("#ctxline").textContent = S.selected && byId[S.selected] ? `Context: ${byId[S.selected].label}` : currentFlow() ? `Context: ${currentFlow().title}` : ""; }
function nodeIndexText() {
  return G.nodes.filter(n => n.type !== "unit" || n.scores.core > 0.15 || W.summaries[n.id]).sort((a, b) => b.scores.core - a.scores.core).slice(0, 600)
    .map(n => `${n.id} | ${n.layer} | ${n.path ? n.path + (n.line ? ":" + n.line : "") : ""}${W.summaries[n.id] ? " | " + W.summaries[n.id] : ""}`).join("\n");
}
const RULES = () => `You are the guide inside "${document.title}", a private reference for a developer learning the ${G.repo} repository${G.scope ? " (scope " + G.scope + ")" : ""} at commit ${G.commit}. Answer questions about this code base.

Ground every claim in the code. Use the tools to search and read the embedded source before answering anything specific; never guess class names, functions or line numbers. Cite code as path:line. If the embedded source does not contain the answer, say so plainly. Answer directly first, then give the evidence. Keep it short. Plain Markdown: short paragraphs, bullet lists, inline code, no headings.

OVERVIEW
${W.overview}

FLOWS
${W.flows.map(f => `- ${f.title}: ${f.steps.map(s => s.node).join(" -> ")}`).join("\n")}

GROUPS (feature groups: units, cohesion, instability)
${GROUPS.slice(0, 40).map(g => `- ${groupLabel(g.id)}: ${g.units} units, cohesion ${g.cohesion}, instability ${g.instability}${(wGroup[g.id] || {}).body ? " — " + wGroup[g.id].body : ""}`).join("\n")}

INFRASTRUCTURE
${G.nodes.filter(n => infraKind(n)).map(n => `- ${n.id} (${KIND_NAMES[infraKind(n)] || ""}): ${n.label}${n.evidence ? ", evidence " + n.path + ":" + n.line : ""}`).join("\n")}

KEY PARTS
${W.keyParts.map(k => `- ${k.title} (${k.ref}): ${k.why}`).join("\n")}

GOTCHAS
${W.gotchas.map(g => `- ${g.title} (${g.ref}): ${g.body}`).join("\n")}

NODES (id | layer | path:line | summary), most important first
${nodeIndexText()}`;
const TOOLS = [
  { name: "search_code", description: "Search the embedded source files for a case-insensitive substring or regex. Returns up to 40 matches as path:line: text.",
    inputSchema: { type: "object", properties: { query: { type: "string" } }, required: ["query"] },
    execute(input) {
      const q = String(input.query || ""); let re; try { re = new RegExp(q, "i"); } catch { re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i"); }
      const out = []; for (const [p, t] of Object.entries(SRC)) { const ls = t.split("\n"); for (let i = 0; i < ls.length && out.length < 40; i++) if (re.test(ls[i])) out.push(`${p}:${i + 1}: ${ls[i].trim().slice(0, 160)}`); if (out.length >= 40) break; }
      setStatus(`Searched for “${q}”`); return out.length ? out.join("\n") : "No matches in the embedded files.";
    } },
  { name: "read_file", description: "Read numbered lines from an embedded source file (full repo path or file name). At most 220 lines per call.",
    inputSchema: { type: "object", properties: { path: { type: "string" }, start: { type: "integer" }, end: { type: "integer" } }, required: ["path"] },
    execute(input) {
      const p = resolvePath(String(input.path || "")); if (!p) throw new Error("No embedded file matches " + input.path);
      const lines = SRC[p].split("\n"); const s = Math.max(1, +input.start || 1); const e = Math.min(lines.length, +input.end || s + 219, s + 219);
      setStatus(`Read ${p.split("/").pop()}`); return `${p} (${lines.length} lines)\n` + lines.slice(s - 1, e).map((l, i) => `${s + i}: ${l}`).join("\n");
    } },
  { name: "graph_neighbours", description: "A node's direct dependencies and dependents in the static graph, with edge kinds.",
    inputSchema: { type: "object", properties: { id: { type: "string" } }, required: ["id"] },
    execute(input) { const id = String(input.id || ""); if (!byId[id]) throw new Error("Unknown node " + id); setStatus(`Looked up ${byId[id].label}`);
      return { node: id, path: byId[id].path, dependsOn: G.edges.filter(e => e.source === id).slice(0, 80).map(e => `${e.target} (${e.kind})`), usedBy: G.edges.filter(e => e.target === id).slice(0, 80).map(e => `${e.source} (${e.kind})`) }; } },
  { name: "find_callers", description: "Resolved call sites of a function or method name across the code (calls into libraries are not tracked). Returns path:line caller -> callee.",
    inputSchema: { type: "object", properties: { name: { type: "string", description: "Function or method name, e.g. saveImportStatus" } }, required: ["name"] },
    execute(input) { const name = String(input.name || ""); const out = []; G.nodes.forEach(n => (n.calls || []).forEach(([fn, dst, nm, ln]) => { if (nm === name && out.length < 60) out.push(`${n.path}:${ln}  ${n.label}.${fn} -> ${byId[dst]?.label || dst}.${nm}()`); }));
      setStatus(`Found callers of ${name}`); return out.length ? out.join("\n") : "No resolved callers."; } },
];
function md(text) {
  return text.split(/```/).map((b, i) => {
    if (i % 2) return `<pre><code>${esc(b.replace(/^\w*\n/, ""))}</code></pre>`;
    let html = "", list = null; const flush = () => { if (list) { html += `</${list}>`; list = null; } };
    for (const raw of b.split("\n")) {
      const ul = raw.match(/^\s*[-*]\s+(.*)/), ol = raw.match(/^\s*\d+[.)]\s+(.*)/);
      if (ul || ol) { const t = ul ? "ul" : "ol"; if (list !== t) { flush(); html += `<${t}>`; list = t; } html += `<li>${mdInline((ul || ol)[1])}</li>`; }
      else if (!raw.trim()) flush(); else { flush(); html += `<p>${mdInline(raw.replace(/^#+\s*/, ""))}</p>`; }
    }
    flush(); return html;
  }).join("");
}
function mdInline(t) {
  let h = esc(t);
  h = h.replace(/`([^`]+)`/g, (m, c) => { const r = c.match(/^([\w./@-]+\.\w+):(\d+)/); return r ? `<button class="ref" data-ref="${esc(r[1] + ":" + r[2])}">${esc(r[1].split("/").pop())}:${r[2]}</button>` : byId[c] ? nodeBtn(c) : `<code>${c}</code>`; });
  h = h.replace(/(^|[\s(])([\w./@-]+\.(?:java|kt|py|ts|tsx|js|jsx|go|rs|rb|sql|ya?ml|json|prisma)):(\d+)/g, (m, pre, p, l) => `${pre}<button class="ref" data-ref="${esc(p + ":" + l)}">${esc(p.split("/").pop())}:${l}</button>`);
  return h.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
}
function setStatus(t) { if (statusEl) statusEl.textContent = t; }
function renderStarters() {
  const starters = W.starters?.length ? W.starters : ["What happens, step by step, when the main entry point is called?", "Which parts of this code are most risky to change?", "Where would I add a new feature like the existing ones?"];
  $("#thread").innerHTML = `<div class="msg-a"><p>Ask anything about ${esc(G.repo)}. Answers come from a model reading the source embedded in this page, with links to the lines it used.</p></div>
    <div class="starters">${starters.map(s => `<button data-starter="${esc(s)}">${esc(s)}</button>`).join("")}</div><div id="askNote"></div>`;
}
function askUnavailable() {
  $("#askNote").innerHTML = `<div class="note">Asking needs this page to be published to a host that lets pages call a model. Opened as a local file, use the Read tab, or ask your coding agent in the repository instead.</div>`;
  $("#askBtn").disabled = true; $("#askInput").disabled = true;
}
$("#thread").addEventListener("click", e => { const b = e.target.closest("[data-starter]"); if (b && sample) { $("#askInput").value = b.dataset.starter; ask(); } });
async function ask() {
  const q = $("#askInput").value.trim(); if (!q || busy || !sample) return;
  if (!turns.length) $("#thread").innerHTML = "";
  const ctx = S.selected && byId[S.selected] ? `\n\n(The viewer has ${S.selected} selected.)` : currentFlow() ? `\n\n(The viewer is reading the flow "${currentFlow().title}".)` : "";
  turns.push({ role: "user", content: q + ctx });
  $("#thread").insertAdjacentHTML("beforeend", `<div class="msg-u">${esc(q)}</div><div class="msg-a"><div class="status"><span class="dots">Thinking</span> <button class="btn" data-stop>Stop</button></div><div class="body"></div></div>`);
  const box = $("#thread").lastElementChild, body = box.querySelector(".body"); statusEl = box.querySelector(".status span");
  box.querySelector("[data-stop]").onclick = () => askCtl?.abort();
  $("#askInput").value = ""; busy = true; $("#askBtn").disabled = true; askCtl = new AbortController();
  try {
    const opts = { signal: askCtl.signal, cache: false, onText: ({ text }) => { body.innerHTML = md(text); $("#thread").scrollTop = $("#thread").scrollHeight; } };
    const lim = await sample.limits().catch(() => null);
    if (lim && lim.tools) { opts.tools = TOOLS; delete opts.cache; }
    const { text, truncated } = await sample([{ role: "user", content: RULES() }, ...turns.slice(-12)], opts);
    body.innerHTML = md(text) + (truncated ? `<p class="lede">The answer was cut short. Ask a narrower question.</p>` : "");
    turns.push({ role: "assistant", content: text });
  } catch (e) {
    const copy = { cancelled: "Stopped.", not_granted: "Asking isn't allowed for this page. You can change that in the page's permissions.", sampling_disabled: "Asking isn't available for this account.", rate_limited: "Too many questions at once. Wait a moment and ask again.", session_expired: "Sign in again, then ask.", prompt_too_large: "The conversation is too long. Reload the page to start again.", refused: "Claude declined to answer that." }[e?.code] || "The answer was interrupted. Ask again.";
    body.innerHTML = (e?.text ? md(e.text) : "") + `<p class="lede">${esc(copy)}</p>`;
    if (e?.text) turns.push({ role: "assistant", content: e.text });
    if (e?.code === "not_granted" || e?.code === "sampling_disabled") { sample = null; askUnavailable(); }
  } finally { box.querySelector(".status")?.remove(); statusEl = null; busy = false; if (sample) $("#askBtn").disabled = false; }
}
$("#askForm").addEventListener("submit", e => { e.preventDefault(); ask(); });
$("#askInput").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); } });

// ---------- boot ----------
function boot() {
  initToolbar(); syncSeg(); renderLegend(); renderIndex(); renderStarters(); initCy();
  const h = (location.hash || "").slice(1);
  const page = h.startsWith("flow-") ? "flow:" + h.slice(5) : h.startsWith("sm-") ? "sm:" + h.slice(3) : ["overview", "components", "keyparts", "recipes", "gotchas", "glossary"].includes(h) ? h : "overview";
  drawMap(); openPage(page, { noHash: true });
  const restyle = () => { cy.style(styleSheet()); renderLegend(); if (S.view === "map") drawMap(); else if (S.view === "flow") drawFlow(currentFlow()); else openPage(S.page, { noHash: true }); };
  try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", restyle); } catch {}
  new MutationObserver(restyle).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  window.addEventListener("resize", () => cy.resize());
  if (window.claude?.use) {
    window.claude.use("sample").then(s => { sample = s; sampleChecked = true; if (!s) askUnavailable(); }).catch(() => { sampleChecked = true; askUnavailable(); });
  } else askUnavailable();
}
if (window.cytoscape || document.readyState === "complete") boot(); else window.addEventListener("load", boot);
</script>
